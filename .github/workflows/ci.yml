name: CI

on:
  push:
    branches: [work, main, ui]
  pull_request:
    branches: [work, main, ui]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,crypto]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
      - name: Privacy scan
        run: python scripts/privacy_scan.py

  ui-screens:
    name: ui-screens (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,crypto,ui-test]"
      - name: Install chromium
        run: python -m playwright install --with-deps chromium
      - name: Install fonts
        run: sudo apt-get install -y fonts-inter
      - name: Screenshot tests
        run: pytest tests/ui -q
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: build/ui-shots
          if-no-files-found: warn
