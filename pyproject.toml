[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "brandcal"
dynamic = ["version"]
description = "CLI and SQLite library for AI agents that manage a human-approved social content calendar."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "brandcal contributors" }]
keywords = ["content-calendar", "ai-agents", "sqlite", "cli", "social-media", "approval"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
brandcal = "brandcal.cli:main"

[project.urls]
Homepage = "https://github.com/Kaikhalid/brandcal"
Issues = "https://github.com/Kaikhalid/brandcal/issues"

[tool.hatch.version]
path = "src/brandcal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/brandcal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
